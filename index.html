<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Device gate (DEVELOPMENT_PLAN.md Stage 14 / PRODUCT_REQUIREMENTS.md
  // §19): a window under 768px wide or narrower than 3:2 goes to
  // mobile/index.html. Runs right after <meta viewport> and before any
  // stylesheet or asset, so nothing of this page is fetched before leaving.
  // Checked on load and live through the same MediaQueryList's 'change'
  // event (fires only when `matches` flips). "not all and
  // (min-aspect-ratio: 3/2)" is a strict "< 3/2", and mobile/index.html's
  // reverse gate is its exact negation, so there is no ping-pong at the
  // boundary. .replace(), so Back doesn't bounce into another redirect.
  var mobileQuery = window.matchMedia('(max-width: 767px), not all and (min-aspect-ratio: 3/2)');

  function goMobile() {
    window.location.replace('mobile/index.html');
  }

  if (mobileQuery.matches) {
    goMobile();
  } else {
    var pendingMobileRedirect = null;
    mobileQuery.addEventListener('change', function (event) {
      if (pendingMobileRedirect) {
        clearTimeout(pendingMobileRedirect);
        pendingMobileRedirect = null;
      }
      if (!event.matches) return; // only react to crossing INTO mobile width
      // Debounced (300ms): guards against a transient/flickering match —
      // DevTools device-emulation toggling, or the brief instant of
      // unstable `innerWidth` some mobile browsers report mid
      // orientation-change — by requiring the narrow state to still hold
      // once the delay elapses, rather than acting on the very first
      // 'change' event.
      pendingMobileRedirect = setTimeout(function () {
        if (mobileQuery.matches) {
          goMobile();
        }
      }, 300);
    });
  }
</script>
<title>Glonari Global Scene</title>
<link rel="stylesheet" href="plaza.css">
</head>
<body>
  <!-- Glonari Plaza 210° (2026-10-24, DEVELOPMENT_PLAN.md Stage 21 /
       PRODUCT_REQUIREMENTS.md §31): the atrium technology — plaza.js draws the
       panorama, the engraved names, Gia on the fountain and the 11 zones. -->
  <main id="stage" aria-label="Glonari plaza. Drag to look around; choose a building to enter.">
    <svg id="overlay" aria-hidden="true"></svg>
  </main>
  <p id="caption" aria-live="polite"></p>
  <nav id="rooms-nav" aria-label="Buildings"></nav>
  <button class="step" id="prev" type="button" aria-label="Previous building"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11.5 3 5.5 9l6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button class="step" id="next" type="button" aria-label="Next building"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="m6.5 3 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <p id="status" role="status"></p>
  <section id="room" hidden aria-labelledby="room-title">
    <div class="room-card">
      <h2 id="room-title"></h2>
      <p id="room-text"></p>
      <button id="back" type="button">Back to the plaza</button>
    </div>
  </section>
  <div id="veil"></div>

  <!-- Custom cursor (2026-10-25, Stage 21 / §31): copy of glonari.com's;
       the dot must come before the ring (.is-hot ~ .gg-ring). -->
  <div class="gg-dot" aria-hidden="true"></div>
  <div class="gg-ring" aria-hidden="true"></div>

  <script src="digital-banker/atrium/vendor/three.min.js"></script>
  <script src="plaza.js" data-base=""></script>
</body>
</html>
