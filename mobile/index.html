<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    // Reverse device gate (2026-08-25, later still — see
    // DEVELOPMENT_PLAN.md Stage 14 / PRODUCT_REQUIREMENTS.md §19 for the
    // full decision writeup). The forward gate in the desktop
    // `index.html` sends narrow viewports here; this had no matching
    // reverse check at all, a known, disclosed gap. Deliberately NOT
    // keyed on viewport width alone, though — a phone rotated to
    // landscape can easily exceed 767px, and must NOT be sent to the
    // desktop scene on that basis: desktop's mouse-hover/parallax model
    // has no touch equivalent (this project decided mobile itself gets
    // no movement/hover equivalent, which is a separate question from
    // whether desktop's own model works on a touchscreen — it doesn't).
    // Gated on width AND `(hover: hover) and (pointer: fine)` — the same
    // primary-input media features this project's own desktop `main.js`
    // already uses for its cursor decision (`finePointerQuery`), reused
    // here for consistency rather than introducing a second detection
    // philosophy for the same underlying question ("is this a
    // mouse-driven device"). A touch-primary device never matches this,
    // landscape or not, regardless of width — only a genuine
    // mouse/trackpad-driven wide window redirects, which rescues the
    // one real gap this leaves open: a desktop user loading this page
    // (directly, or via the forward gate) with a narrow BROWSER WINDOW,
    // then widening it without a reload.
    //
    // Known, accepted imprecision (same tradeoff `finePointerQuery`
    // already carries on desktop): `pointer`/`hover` reflect the
    // PRIMARY input, so a touch+mouse hybrid device (e.g. a 2-in-1
    // laptop used via its touchscreen) can still match if its primary
    // input is classified as mouse/trackpad — not solved here, consistent
    // with how the existing desktop gate already treats that ambiguity.
    //
    // Checked once synchronously on load (mirroring the forward gate,
    // and closing the "deep-links directly into mobile/index.html stays
    // there" gap) AND live via the same 'change'-event + debounce pattern
    // as the forward gate, so a rotation/resize after load is caught too.
    // 2026-10-13: the width/aspect part is now the exact negation of the
    // desktop gate ('(max-width: 767px), not all and (min-aspect-ratio:
    // 3/2)') — at least 768px wide AND at least 3:2 — so a window the
    // desktop page would send here is never sent back (no redirect loop).
    // The (hover)/(pointer) part is unchanged.
    var desktopQuery = window.matchMedia('(min-width: 768px) and (min-aspect-ratio: 3/2) and (hover: hover) and (pointer: fine)');

    function goDesktop() {
      window.location.replace('../index.html');
    }

    if (desktopQuery.matches) {
      goDesktop();
    } else {
      var pendingDesktopRedirect = null;
      desktopQuery.addEventListener('change', function (event) {
        if (pendingDesktopRedirect) {
          clearTimeout(pendingDesktopRedirect);
          pendingDesktopRedirect = null;
        }
        if (!event.matches) return;
        pendingDesktopRedirect = setTimeout(function () {
          if (desktopQuery.matches) {
            goDesktop();
          }
        }, 300);
      });
    }
  </script>
  <title>Glonari — Global</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../design-tokens.css" />
  <link rel="stylesheet" href="../section-modal.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="../plaza.css" />
</head>
<body>
  <!-- Glonari Plaza 210° (2026-10-24, DEVELOPMENT_PLAN.md Stage 21 /
       PRODUCT_REQUIREMENTS.md §31): the atrium technology — plaza.js draws the
       panorama, the engraved names, Gia on the fountain and the 11 zones. -->
  <main id="stage" aria-label="Glonari plaza. Drag to look around; choose a building to enter.">
    <svg id="overlay" aria-hidden="true"></svg>
  </main>
  <p id="caption" aria-live="polite"></p>
  <nav id="rooms-nav" aria-label="Buildings"></nav>
  <button class="step" id="prev" type="button" aria-label="Previous building"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11.5 3 5.5 9l6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <button class="step" id="next" type="button" aria-label="Next building"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="m6.5 3 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
  <p id="status" role="status"></p>
  <section id="room" hidden aria-labelledby="room-title">
    <div class="room-card">
      <h2 id="room-title"></h2>
      <p id="room-text"></p>
      <button id="back" type="button">Back to the plaza</button>
    </div>
  </section>
  <div id="veil"></div>

  <!-- Same #modal-overlay/#modal-card markup as desktop's index.html —
       required as-is by the shared section-modal.js/section-modal.css —
       plus a corner × (mobile only; wired in main.js). -->
  <div id="modal-overlay">
    <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
      <button class="modal-x" type="button" aria-label="Close">×</button>
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <button id="modal-close" type="button">Close</button>
    </div>
  </div>

  <!-- Custom cursor (2026-10-25, Stage 21 / §31): same as index.html, for a
       mouse in a window narrower than 3:2; plaza.css/plaza.js show it only
       under (hover: hover) and (pointer: fine), so phones never get it. -->
  <div class="gg-dot" aria-hidden="true"></div>
  <div class="gg-ring" aria-hidden="true"></div>

  <script src="../digital-banker/atrium/vendor/three.min.js"></script>
  <script src="../plaza.js" data-base="../"></script>
  <script src="../section-modal.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
